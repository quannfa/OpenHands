
services:
  openhands:
    build:
      context: ./
      dockerfile: ./containers/app/Dockerfile
    image: openhands:latest
    container_name: openhands-app-zqf
    environment:
      - AGENT_SERVER_IMAGE_REPOSITORY=${AGENT_SERVER_IMAGE_REPOSITORY:-ghcr.io/openhands/agent-server}
      - AGENT_SERVER_IMAGE_TAG=${AGENT_SERVER_IMAGE_TAG:-1.25.0-python}
      - SANDBOX_USER_ID=${SANDBOX_USER_ID:-1001} # match the host UID to avoid workspace permission issues
      - SANDBOX_NVIDIA_RUNTIME=${SANDBOX_NVIDIA_RUNTIME:-true}
      - SANDBOX_GPU_COUNT=all
      - WORKSPACE_MOUNT_PATH=/home/aibio/Task/OpenHands/openhands_in_docker/workspace
      - SANDBOX_VOLUMES=/home/aibio/Task/OpenHands/openhands_in_docker/workspace:/workspace:rw,/home/aibio/Task:/home/aibio/Task:rw,/home/aibio/Task/OpenHands/openhands_in_docker/home/skills:/home/openhands/.agents/skills:ro
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/aibio/Task/OpenHands/openhands_in_docker/home:/.openhands
      - /home/aibio/Task/OpenHands/openhands_in_docker/workspace:/opt/workspace_base
      - /home/aibio/Task:/home/aibio/Task
    pull_policy: build
    stdin_open: true
    tty: true
